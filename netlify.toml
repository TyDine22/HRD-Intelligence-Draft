# Netlify configuration for the HRD Intelligence frontend (Next.js static export).
# `next build` writes a fully static site to out/ (see next.config.ts), so no
# Next.js runtime or serverless functions are required.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
